flutter_launcher_icons:
  image_path: "assets/icons/app-icon.png"

  android: true
  # image_path_android: "assets/icons/app-icon.png"
  min_sdk_android: 29 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff" # used to fill out the background of the adaptive icon.
  adaptive_icon_foreground: "assets/icons/app-icon.png"
  adaptive_icon_foreground_inset: 16
  # adaptive_icon_monochrome: "assets/icons/monochrome.png"

  ios: true
  # image_path_ios: "assets/icon/icon.png"
  remove_alpha_ios: true
  # image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  # image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  # desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#ffffff"

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
