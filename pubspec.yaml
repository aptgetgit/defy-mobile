name: defy
description: "Defy App"

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  aptos_dart:
    path: packages/aptos-dart

  defy_graphql:
    path: packages/defy-graphql

  cupertino_icons: ^1.0.8
  hooks_riverpod: ^2.5.2
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.3.2
  go_router: ^14.2.8
  dio: ^5.7.0
  logger: ^2.4.0

  intl: ^0.19.0
  envied: ^1.0.0
  flutter_animate: ^4.5.0
  phosphor_flutter: ^2.1.0
  gap: ^3.0.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  built_value: ^8.9.2
  one_of: ^1.5.0
  objectbox: ^4.0.2
  objectbox_flutter_libs: ^4.0.2
  retrofit: ^4.4.1
  path_provider: ^2.1.4
  path: ^1.9.0
  bip39: ^1.0.6
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  rxdart: ^0.28.0
  jwk: ^0.2.3
  ed25519_edwards: ^0.3.1
  assorted_layout_widgets: ^10.6.0
  flutter_svg: ^2.0.17
  flutter_screenutil: ^5.9.3
  expandable: ^5.0.1
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  graphql_flutter: ^5.2.0-beta.8
  lottie: ^3.3.1
  syncfusion_flutter_charts: ^28.2.4+1
  fl_chart: ^0.70.2
  audioplayers: ^6.1.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.13
  go_router_builder: ^2.7.1
  flutter_gen_runner: ^5.7.0
  envied_generator: ^1.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  objectbox_generator: ^4.0.2
  retrofit_generator: ^9.1.2

# Flutter Gen Configuration
flutter_gen:
  output: lib/config

# ObjectBox Configuration
objectbox:
  output_dir: core/database/objectbox

# Flutter Configuration
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/animations/
    - assets/icons/
    - assets/audios/

  # TODO: Do we need resolution aware images ?
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  fonts:
    - family: SFCompactRounded
      fonts:
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Black.otf
          weight: 900
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Heavy.otf
          weight: 800
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Bold.otf
          weight: 700
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Semibold.otf
          weight: 600
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Medium.otf
          weight: 500
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Regular.otf
          weight: 400
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Light.otf
          weight: 300
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Thin.otf
          weight: 200
        - asset: assets/fonts/sf_compact_rounded/SF-Compact-Rounded-Ultralight.otf
          weight: 100