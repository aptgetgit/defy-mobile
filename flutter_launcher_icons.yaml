flutter_launcher_icons:
  image_path: "assets/icons/app-icon.png"

  android: true
  image_path_android: "assets/icons/app-icon.png"
  min_sdk_android: 29
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app-icon.png"
  adaptive_icon_foreground_inset: 24
  adaptive_icon_monochrome: "assets/icons/app-icon.png"

  ios: true
  image_path_ios: "assets/icons/app-icon.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icons/app-icon.png"
  # image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#000000"

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
